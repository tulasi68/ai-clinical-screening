<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI Clinical Screening</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#0F172A;background:#F8FAFC}
*{box-sizing:border-box}body{margin:0}.shell{max-width:680px;margin:auto;min-height:100vh;padding:24px 18px 34px}
.card{background:#fff;border:1px solid #E2E8F0;border-radius:22px;padding:24px;box-shadow:0 4px 20px #00000008;position:relative}
h1{font-size:24px;margin:0 0 8px}h2{font-size:20px;margin:0 0 16px}.muted{color:#64748B;line-height:1.55;font-size:14px}.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#64748B;margin-bottom:8px}
button{border:0;border-radius:999px;padding:13px 20px;font-weight:650;font-size:15px;cursor:pointer}button.primary{background:#FF6B00;color:#fff}button.secondary{background:#F1F5F9;color:#1E293B}button:disabled{opacity:.5;cursor:not-allowed}
.center{text-align:center;padding:46px 12px}.start-note{margin:18px auto 24px;max-width:430px}
.composer{display:flex;gap:8px;position:sticky;bottom:0;background:#F8FAFC;padding:10px 0}.composer input{min-width:0;flex:1;border:1px solid #E2E8F0;border-radius:999px;padding:13px 16px;font:inherit;outline:none}.composer input:focus{border-color:#FF6B00}
.summary-grid{display:grid;gap:15px}.field{border:1px solid #E2E8F0;border-radius:14px;padding:13px}.field label{display:block;font-size:12px;color:#64748B;margin-bottom:7px;font-weight:650}.field textarea,.field input{width:100%;border:0;outline:0;font:inherit;line-height:1.45;resize:vertical;background:transparent}.field textarea{min-height:55px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.notice{margin:14px 0;padding:12px 14px;border-radius:14px;background:#FFF7ED;color:#9A3412;font-size:14px;line-height:1.45}.error{color:#9B1C1C;background:#FFF0F0;padding:11px 13px;border-radius:12px;font-size:14px;margin-top:14px}
.progress{height:6px;background:#E2E8F0;border-radius:99px;overflow:hidden;margin:6px 0 18px}.progress i{display:block;height:100%;background:#FF6B00;border-radius:99px;transition:width .25s}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:6px 0 14px}.opts.one{grid-template-columns:1fr}
.opt{border:1.5px solid #E2E8F0;background:#fff;color:#0F172A;border-radius:12px;padding:15px 12px;font:inherit;font-weight:600;text-align:left;min-height:54px;cursor:pointer;line-height:1.3}
.opt:hover{border-color:#FF6B00}.opt.sel{border-color:#FF6B00;background:#FFF7ED;box-shadow:inset 0 0 0 1px #FF6B00}
.radios{display:flex;flex-direction:column;gap:8px;margin:6px 0 14px}.radio{display:flex;align-items:center;gap:12px;border:1.5px solid #E2E8F0;border-radius:12px;padding:14px;font-weight:600;cursor:pointer}.radio input{accent-color:#FF6B00;width:18px;height:18px;margin:0}.radio.sel{border-color:#FF6B00;background:#FFF7ED}
.typed{width:100%;border:1.5px solid #E2E8F0;border-radius:12px;padding:13px 14px;font:inherit;outline:none;margin:0 0 14px}.typed:focus{border-color:#FF6B00}
.tokenbox{margin:6px auto 22px;max-width:300px;border:1.5px solid #FF6B00;background:#FFF7ED;border-radius:16px;padding:16px}.tokenno{font-size:40px;font-weight:800;color:#FF6B00;line-height:1.1;margin:4px 0}.ahead{font-size:16px;margin-top:6px}
.small{font-size:12px;color:#64748B}.hidden{display:none!important}
.lang-bar{position:absolute;top:14px;right:14px;z-index:2}
.lang-bar select{border:1.5px solid #E2E8F0;border-radius:999px;padding:8px 12px;font:inherit;font-size:13px;font-weight:600;background:#fff;color:#0F172A;cursor:pointer;outline:none}
.lang-bar select:focus{border-color:#FF6B00}
.q-sub{display:block;font-size:13px;font-weight:500;color:#64748B;margin-top:6px;line-height:1.4}
</style>
</head>
<body>
<main class="shell"><div id="app" class="card"></div></main>
<script>
PLACEHOLDER_SCRIPT
</script>
</body>
</html>
