<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pre-consultation</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#18202a;background:#fafafa}
*{box-sizing:border-box}body{margin:0}.shell{max-width:680px;margin:auto;min-height:100vh;padding:24px 18px 34px}
.card{background:#fff;border:1px solid #e6e8eb;border-radius:22px;padding:24px;box-shadow:0 4px 20px #00000008}
h1{font-size:24px;margin:0 0 8px}h2{font-size:20px;margin:0 0 16px}.muted{color:#68717d;line-height:1.55;font-size:14px}.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#6b7280;margin-bottom:8px}
button{border:0;border-radius:999px;padding:13px 20px;font-weight:650;font-size:15px;cursor:pointer}button.primary{background:#1d6f5b;color:#fff}button.secondary{background:#f0f2f3;color:#26313b}button:disabled{opacity:.5;cursor:not-allowed}
.center{text-align:center;padding:46px 12px}.start-note{margin:18px auto 24px;max-width:430px}
.chat{display:flex;flex-direction:column;gap:12px;margin:22px 0 16px;max-height:55vh;overflow:auto}.bubble{max-width:88%;padding:12px 15px;border-radius:18px;line-height:1.5;font-size:15px;white-space:pre-wrap}.ai{background:#f0f2f3;align-self:flex-start}.patient{background:#1d6f5b;color:#fff;align-self:flex-end}
.composer{display:flex;gap:8px;position:sticky;bottom:0;background:#fafafa;padding:10px 0}.composer input{min-width:0;flex:1;border:1px solid #d7dce0;border-radius:999px;padding:13px 16px;font:inherit;outline:none}.composer input:focus{border-color:#1d6f5b}
.summary-box{border:1px solid #e2e5e8;border-radius:16px;padding:8px 0;line-height:1.55;font-size:15px;background:#fafbfc}
.summary-rows{display:flex;flex-direction:column}
.summary-row{display:grid;grid-template-columns:minmax(110px,38%) 1fr;gap:10px;padding:12px 18px;border-bottom:1px solid #eef1f3}
.summary-row:last-child{border-bottom:0}
.summary-topic{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#6b7280;padding-top:2px}
.summary-answer{font-size:15px;color:#18202a;font-weight:600}
.summary-meta{margin:12px 0 0;font-size:13px;color:#68717d;line-height:1.5}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.notice{margin:14px 0;padding:12px 14px;border-radius:14px;background:#fff7df;color:#5f4c15;font-size:14px;line-height:1.45}.error{color:#9b1c1c;background:#fff0f0;padding:11px 13px;border-radius:12px;font-size:14px;margin-top:14px}
.small{font-size:12px;color:#7b8490}.hidden{display:none!important}
.choice-btn{width:100%;text-align:left;border:1px solid #d7dce0;background:#fff;border-radius:14px;padding:14px 16px;font:inherit;font-weight:600;cursor:pointer}
.choice-btn.selected{background:#e7f4ef;border-color:#1d6f5b}
.choice-btn.muted-choice{font-weight:500;color:#4b5563;background:#f9fafb}
.linkish{background:transparent;color:#1d6f5b;text-decoration:underline;padding:8px 4px;font-size:13px;font-weight:600}
</style>
</head>
<body>
<main class="shell"><div id="app" class="card"></div></main>
<script>
const token = decodeURIComponent(location.pathname.split('/s/')[1] || '');
const app = document.getElementById('app');
let state = null;
let busy = false;

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c]));}
function showError(msg){let e=document.getElementById('error');if(e){e.textContent=msg;e.classList.remove('hidden');}}
function clearError(){let e=document.getElementById('error');if(e)e.classList.add('hidden');}
function btn(text,cls='primary',id=''){return '<button id="'+id+'" class="'+cls+'">'+esc(text)+'</button>';}

async function api(path,opts={}){
  const r=await fetch(path,{...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});
  const d=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error||d.detail||'Something went wrong. Please try again.');
  return d;
}

async function load(){
  if(!token){app.innerHTML='<div class="center"><h1>Pre-consultation</h1><p class="muted">This link is incomplete.</p></div>';return;}
  try{
    state=await api('/api/patient/s/'+encodeURIComponent(token));
    if(state.status==='submitted'){renderSubmitted();return;}
    if(state.status==='awaiting_review'||state.output){renderReview(state.output);return;}
    const msgs = state.conversation || [];
    if(msgs.some(m=>m.role==='assistant')){
      state.messages = msgs.map(m=>({role:m.role,message:m.message}));
      try{
        const d=await api('/api/patient/s/'+encodeURIComponent(token)+'/start',{method:'POST',body:'{}'});
        if(d.type==='review'){renderReview(d.output);return;}
        state.questionOptions=d.options||[];
        state.selectionMode=d.selection_mode||'single';
        state.selectedKeys=[];
        renderChat(null, state.questionOptions, state.selectionMode);
        return;
      }catch(_){ /* fall through to welcome */ }
    }
    renderWelcome();
  }catch(e){app.innerHTML='<div class="center"><h1>Pre-consultation</h1><p class="muted">This link is invalid or has expired.</p></div>';}
}

function renderWelcome(){
  const p=state.patient;
  app.innerHTML='<div class="center"><div class="eyebrow">Before your consultation</div><h1>Talk to the doctor</h1>'+
  '<p class="muted start-note">Hello, '+esc(p.patient_name)+'. A short conversation will help the doctor understand your problem before seeing you.</p>'+
  '<p class="small">This is not a diagnosis or a prescription.</p><div style="margin-top:24px">'+btn('Start','primary','start')+'</div><div id="error" class="error hidden"></div></div>';
  document.getElementById('start').onclick=startChat;
}
async function startChat(){
  clearError();document.getElementById('start').disabled=true;
  try{const d=await api('/api/patient/s/'+encodeURIComponent(token)+'/start',{method:'POST',body:'{}'}); if(d.type==='review')renderReview(d.output);else renderChat(d.message,d.options,d.selection_mode);}
  catch(e){document.getElementById('start').disabled=false;showError(e.message);}
}
function renderChat(first, options=[], selectionMode="single"){
  state.messages=state.messages||[];
  state.questionOptions=Array.isArray(options)?options:[];
  state.selectionMode=selectionMode||"single";
  state.selectedKeys=[];
  if(first && !state.messages.some(m=>m.role==='assistant' && m.message===first)){
    state.messages.push({role:'assistant',message:first});
  }
  app.innerHTML='<div class="eyebrow">Before your consultation</div><h2>Your conversation</h2>'+
  '<p class="muted">Tap an answer, or type your own. You can change your mind before sending.</p><div id="chat" class="chat"></div>'+
  '<div id="choices" style="display:flex;flex-direction:column;gap:10px;margin-top:12px"></div>'+
  '<div id="composer" class="composer hidden"></div>'+
  '<div id="error" class="error hidden"></div>';
  drawMessages();
  drawChoices();
}
function drawMessages(){
  const c=document.getElementById('chat');if(!c)return;
  c.innerHTML=(state.messages||[]).map(m=>'<div class="bubble '+(m.role==='patient'?'patient':'ai')+'">'+esc(m.message)+'</div>').join('');
  c.scrollTop=c.scrollHeight;
}
function drawComposer(force=false){
  const box=document.getElementById('composer');if(!box)return;
  box.classList.remove('hidden');
  box.innerHTML='<input id="answer" type="text" maxlength="4000" placeholder="Type your answer…" autocomplete="off">'+btn('Send','primary','send');
  const input=document.getElementById('answer');
  const send=document.getElementById('send');
  const go=()=>{
    const text=(input.value||'').trim();
    if(!text||busy)return;
    submitTextAnswer(text);
  };
  send.onclick=go;
  input.onkeydown=(e)=>{if(e.key==='Enter'){e.preventDefault();go();}};
  if(force) input.focus();
}
function hideComposer(){
  const box=document.getElementById('composer');if(!box)return;
  box.classList.add('hidden');
  box.innerHTML='';
}
function shouldAllowTypeOwn(){
  const opts=(state.questionOptions||[]).filter(o=>o && o.key!=='other' && o.key!=='unsure');
  if(!opts.length) return true;
  if(state.selectionMode==='multi') return true;
  if(opts.length<=3){
    const keys=opts.map(o=>String(o.key||'').toLowerCase());
    const closed=['yes','no','left','right','bilateral','both','mild','moderate','severe','none'];
    if(keys.every(k=>closed.includes(k))) return false;
  }
  return true;
}
function drawChoices(){
  const box=document.getElementById('choices');if(!box)return;
  const opts=(state.questionOptions||[]).filter(o=>o && o.key !== 'other');
  if(!opts.length){
    box.innerHTML='<p class="small">Type your answer below.</p>';
    drawComposer(true);
    return;
  }
  const allowOwn=shouldAllowTypeOwn();
  box.innerHTML=opts.map((o,i)=>{
    const muted = o.key==='unsure' ? ' muted-choice' : '';
    return '<button type="button" data-choice="'+i+'" class="choice-btn'+muted+'">'+esc(o.label)+'</button>';
  }).join('')+
  (allowOwn?'<button type="button" id="typeOwn" class="choice-btn muted-choice">Type my own answer</button>':'');
  const filtered = opts;
  box.querySelectorAll('.choice-btn[data-choice]').forEach((b)=>{
    b.onclick=()=>chooseOptionByKey(filtered[Number(b.dataset.choice)]);
  });
  const typeOwn=document.getElementById('typeOwn');
  if(typeOwn) typeOwn.onclick=()=>{ drawComposer(true); };
  if(state.selectionMode==='multi'){
    let cont=document.getElementById('continueChoices');
    if(!cont){
      cont=document.createElement('button');cont.id='continueChoices';cont.textContent='Continue with selected';cont.className='primary';cont.style.marginTop='4px';cont.style.width='100%';
      box.appendChild(cont);cont.onclick=submitSelectedOptions;
    }
  }
  setChoiceSelection();
}
function setChoiceSelection(){
  const box=document.getElementById('choices');if(!box)return;
  const opts=(state.questionOptions||[]).filter(o=>o && o.key !== 'other');
  box.querySelectorAll('.choice-btn[data-choice]').forEach((b,i)=>{
    const selected=state.selectedKeys.includes(opts[i]?.key);
    b.classList.toggle('selected', selected);
  });
}
async function chooseOptionByKey(option){
  if(!option||busy)return;
  if(option.value==='__FREE_TEXT__'||option.key==='other'){
    drawComposer(true);
    return;
  }
  if(state.selectionMode==='multi'){
    if(option.key==='none'){
      state.selectedKeys=['none'];
    }else{
      state.selectedKeys=state.selectedKeys.filter(k=>k!=='none');
      const pos=state.selectedKeys.indexOf(option.key);
      if(pos>=0)state.selectedKeys.splice(pos,1);else state.selectedKeys.push(option.key);
    }
    setChoiceSelection();
    return;
  }
  await submitAnswer([option]);
}
async function submitSelectedOptions(){
  const opts=(state.questionOptions||[]).filter(o=>state.selectedKeys.includes(o.key) && o.key!=='other');
  if(opts.length) await submitAnswer(opts);
}
async function submitTextAnswer(text){
  if(busy)return;
  clearError();
  const question=[...(state.messages||[])].reverse().find(m=>m.role==='assistant')?.message||'';
  state.messages.push({role:'patient',message:text});drawMessages();
  const box=document.getElementById('choices');if(box)box.innerHTML='<p class="small">Recording your answer…</p>';
  hideComposer();
  busy=true;
  try{
    const d=await api('/api/patient/s/'+encodeURIComponent(token)+'/message',{method:'POST',body:JSON.stringify({
      message:text, question
    })});
    if(d.type==='review'){renderReview(d.output);return;}
    state.messages.push({role:'assistant',message:d.message});
    state.questionOptions=d.options||[];state.selectionMode=d.selection_mode||'single';state.selectedKeys=[];
    drawMessages();drawChoices();
  }catch(e){
    showError(e.message||'Could not save that answer. Please try again.');
    if(state.messages.length && state.messages[state.messages.length-1].role==='patient'){
      state.messages.pop();
      drawMessages();
    }
    drawChoices();
  }finally{busy=false;}
}
async function submitAnswer(options){
  if(busy)return;
  clearError();
  const choices=Array.isArray(options)?options:[];
  if(!choices.length)return;
  const label=choices.map(o=>o.label).join(', ');
  const value=choices.map(o=>o.value).join('; ');
  const question=[...(state.messages||[])].reverse().find(m=>m.role==='assistant')?.message||'';
  state.messages.push({role:'patient',message:label});drawMessages();
  const box=document.getElementById('choices');if(box)box.innerHTML='<p class="small">Recording your answer…</p>';
  hideComposer();
  busy=true;
  try{
    const d=await api('/api/patient/s/'+encodeURIComponent(token)+'/message',{method:'POST',body:JSON.stringify({
      message:value, question, selected_option:{key:choices.map(o=>o.key).join(','),label,value}
    })});
    if(d.type==='review'){renderReview(d.output);return;}
    state.messages.push({role:'assistant',message:d.message});
    state.questionOptions=d.options||[];state.selectionMode=d.selection_mode||'single';state.selectedKeys=[];
    drawMessages();drawChoices();
  }catch(e){
    showError(e.message||'Could not save that answer. Please try again.');
    if(state.messages.length && state.messages[state.messages.length-1].role==='patient'){
      state.messages.pop();
      drawMessages();
    }
    drawChoices();
  }finally{busy=false;}
}
function topicFromQA(question, answer){
  const q=String(question||'').toLowerCase();
  const a=String(answer||'').toLowerCase();
  if(/no known drug allergy|drug allergy/.test(a) || /allerg/.test(q)) return 'Drug allergies';
  if(/nothing tried|painkiller|ear drops|home remed|antibiotic|medicine helped|did not help/.test(a) || /medicine|drops|painkiller|tried any|home remed|did they help/.test(q)) return 'Medicines tried';
  if(/^\s*(yes|no)\s*\.?$/i.test(a.trim())){
    if(/fever/.test(q)) return 'Fever';
    if(/dizz/.test(q)) return 'Dizziness';
    if(/discharge/.test(q)) return 'Discharge present';
    if(/hearing/.test(q)) return 'Hearing change';
    if(/allerg/.test(q)) return 'Drug allergies';
    if(/medicine|tried|drops/.test(q)) return 'Medicines tried';
    return 'Confirmation';
  }
  if(/watery|thick|yellow|green|bloody|clear discharge/.test(a) || /describe.*discharge|what.*(look|colour|color).*discharge/.test(q)) return 'Discharge';
  if(/left only|right only|both sides|^left$|^right$|bilateral/.test(a) || (/\bleft\b|\bright\b|both ears|one ear|which (ear|side)/.test(q) && !/day|severe|mild|moderate|medicine|fever|discharge type/.test(q))) return 'Side';
  if(/1–2 days|3–7 days|1–2 weeks|more than 2 weeks|getting worse|getting better|staying the same/.test(a) || /how many days|how long|duration|getting (better|worse)/.test(q)) return 'Duration / course';
  if(/^(mild|moderate|severe)$/i.test(a.trim()) || /mild|moderate|severe|how bad|severity/.test(q)) return 'Severity';
  if(/muffled|underwater|can't hear|reduced hearing|hearing is fine/.test(a) || /muffled|hearing trouble|underwater/.test(q)) return 'Hearing';
  if(/fever|dizziness|swollen|voice change|recent cold/.test(a) || /fever|dizziness|swollen gland|associated|none of these|voice change/.test(q)) return 'Other symptoms';
  if(/diabetes|blood pressure|asthma|ongoing/.test(a) || /diabetes|blood pressure|ongoing illness|regular medicines/.test(q)) return 'Other illnesses';
  if(/pain|blockage|discharge|tinnitus|ringing|hearing trouble/.test(a) && /ear|feeling|happening/.test(q)) return 'Ear symptoms';
  if(/ear.*nose.*throat|problem with your ear|combination of these|mainly the ear|main area/.test(q) || /^(ear|nose|throat)$/i.test(a.trim())) return 'Area of problem';
  if(/throat|swallow/.test(q)) return 'Throat';
  if(/nose|nasal/.test(q)) return 'Nose';
  const short=String(question||'').replace(/\s+/g,' ').trim();
  return short.length>48 ? short.slice(0,48)+'…' : (short || 'Answer');
}

function summaryRowsFromConversation(){
  const conv = state.conversation || [];
  const rows=[];
  for(const m of conv){
    if(m.role!=='patient') continue;
    const q = m.question || '';
    const ans = (m.selected_option && m.selected_option.label) || m.message || '';
    if(!ans) continue;
    if(/^\s*(yes|no)\s*\.?$/i.test(String(ans).trim()) && !/fever|dizz|allerg|discharge|hearing|medicine|pain/.test(String(q).toLowerCase())) continue;
    rows.push({ topic: topicFromQA(q, ans), answer: ans });
  }
  if(rows.length) return dedupeRows(rows);
  let lastQ=null;
  for(const m of (state.messages||[])){
    if(m.role==='assistant'){ lastQ=m.message; continue; }
    if(m.role==='patient' && lastQ){
      const ans=m.message;
      if(/^\s*(yes|no)\s*\.?$/i.test(String(ans).trim()) && !/fever|dizz|allerg|discharge|hearing|medicine|pain/.test(String(lastQ).toLowerCase())){ lastQ=null; continue; }
      rows.push({ topic: topicFromQA(lastQ, ans), answer: ans });
      lastQ=null;
    }
  }
  return dedupeRows(rows);
}
function dedupeRows(rows){
  const out=[];
  for(const r of rows){
    if(out.length && out[out.length-1].topic===r.topic){
      const prev=out[out.length-1];
      if(!String(prev.answer).toLowerCase().includes(String(r.answer).toLowerCase())) prev.answer = prev.answer + ', ' + r.answer;
    } else out.push({topic:r.topic, answer:r.answer});
  }
  return out;
}

function summaryRowsFromOutput(o){
  if(!o) return [];
  const rows=[];
  if(o.presenting_complaint) rows.push({ topic:'Main problem', answer:o.presenting_complaint });
  (o.symptoms||[]).forEach(s=>{
    if(s.symptom) rows.push({ topic:'Symptom', answer:s.symptom });
    if(s.location) rows.push({ topic:'Location / side', answer:s.location });
    if(s.duration) rows.push({ topic:'Duration', answer:s.duration });
    if(s.severity) rows.push({ topic:'Severity', answer:s.severity });
    if(s.details) rows.push({ topic:'Details', answer:s.details });
  });
  if((o.associated_symptoms||[]).length) rows.push({ topic:'Other symptoms', answer:(o.associated_symptoms||[]).join(', ') });
  if((o.medications||[]).length) rows.push({ topic:'Medicines tried', answer:(o.medications||[]).join(', ') });
  if((o.allergies||[]).length) rows.push({ topic:'Drug allergies', answer:(o.allergies||[]).join(', ') });
  if((o.medical_history||[]).length) rows.push({ topic:'Other illnesses', answer:(o.medical_history||[]).join(', ') });
  return rows;
}

function formatSummaryHtml(o){
  let rows = summaryRowsFromConversation();
  if(!rows.length) rows = summaryRowsFromOutput(o);
  if(!rows.length && o && o.summary){
    const lines=String(o.summary).split(/\n+/).map(x=>x.trim()).filter(Boolean);
    rows = lines.map((line,i)=>({ topic: 'Point '+(i+1), answer: line }));
  }
  if(!rows.length) return '<p class="muted">Summary is being prepared.</p>';
  return '<div class="summary-rows">'+rows.map(r=>
    '<div class="summary-row"><div class="summary-topic">'+esc(r.topic)+'</div><div class="summary-answer">'+esc(r.answer)+'</div></div>'
  ).join('')+'</div>';
}

function renderReview(output){
  state.output=output;
  const urgent=output?.screening_status==='urgent';
  app.innerHTML='<div class="eyebrow">Ready for your doctor</div><h2>Summary</h2>'+
  (urgent?'<div class="notice"><strong>Important:</strong> Please seek urgent medical care now. This chat does not replace emergency care.</div>':'')+
  '<p class="muted">Based on your conversation. Check each point, then send to your doctor when ready.</p>'+
  '<div class="summary-box">'+formatSummaryHtml(output)+'</div>'+
  '<div class="actions">'+btn('Send to doctor','primary','submit')+'</div>'+
  '<div id="error" class="error hidden"></div><p class="small" style="margin-top:18px">Nothing is shared with the clinic until you send it.</p>';
  document.getElementById('submit').onclick=submitSummary;
}

async function submitSummary(){
  clearError();
  const b=document.getElementById('submit');if(b){b.disabled=true;b.textContent='Sending…';}
  try{
    const d=await api('/api/patient/s/'+encodeURIComponent(token)+'/submit',{method:'POST',body:'{}'});
    state.output=d.output;state.status='submitted';try{state=await api('/api/patient/s/'+encodeURIComponent(token));}catch(_){ }renderSubmitted();
  }catch(e){showError(e.message);b.disabled=false;}
}
function renderSubmitted(){
  if(window.__queueTimer){ clearInterval(window.__queueTimer); window.__queueTimer=null; }
  const tok = (state && state.patient && state.patient.queue_token) || '—';
  app.innerHTML='<div class="center"><div class="eyebrow">Sent</div><h1>Thank you</h1>'+
    '<p class="muted start-note">Your answers have been sent to the clinic.</p>'+
    '<div id="queueCard" style="margin:18px auto;max-width:360px;padding:18px;border-radius:16px;background:#eef8f4;border:1px solid #cfe8de">'+
    '<div class="eyebrow">Clinic queue</div>'+
    '<div>Your token number</div>'+
    '<div style="font-size:32px;font-weight:800;color:#1d6f5b;margin:8px 0" id="queueToken">'+esc(tok)+'</div>'+
    '<p id="queueAhead" class="muted">Checking queue…</p>'+
    '<p class="small" style="margin-top:12px">Keep this page open. It updates automatically.</p>'+
    '</div></div>';
  async function refreshQueue(){
    try{
      const d=await api('/api/patient/s/'+encodeURIComponent(token)+'/queue');
      const el=document.getElementById('queueAhead');
      const tEl=document.getElementById('queueToken');
      if(tEl && d.token) tEl.textContent=d.token;
      if(!el) return;
      const n = d.waiting_ahead;
      if(n==null || n===undefined){ el.textContent='Queue position will appear when the clinic is online.'; return; }
      if(Number(n)<=1){ el.innerHTML='<strong style="color:#0f5c4a">You are next — get ready to meet the doctor.</strong>'; }
      else { el.innerHTML='Patients before you: <strong>'+esc(String(n))+'</strong>'; }
    }catch(e){
      const el=document.getElementById('queueAhead');
      if(el) el.textContent='Queue position will appear when the clinic is online.';
    }
  }
  refreshQueue();
  window.__queueTimer=setInterval(refreshQueue, 5000);
}
load();
</script>
</body>
</html>
